services:
  db: 
    image: postgres:18
    container_name: bancoPI
    environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: projetoPI
    POSTGRES_DB: coopvale
    TZ: America/Fortaleza
  ports: 
    - "5432:5432" 
  volumes: 
    - pgdata:/var/lib/postgresql/data 
    - ./initdb:/docker-entrypoint-initdb.d:ro 
  healthcheck: 
    test: ["CMD-SHELL", "pg_isready -U postgres"] 
    interval: 5s 
    retries: 10 
    
  pgadmin: 
    image: dpage/pgadmin4 
    environment: 
      PGADMIN_DEFAULT_EMAIL: aluno@ufc.br 
      PGADMIN_DEFAULT_PASSWORD: projetoPI 
    ports: - "8080:80" 
    depends_on: 
      db: 
        condition: service_healthy
  
  volumes: 
    pgdata:
